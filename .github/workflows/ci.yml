name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint client
        run: npm run lint:client

      - name: Lint server
        run: npm run lint:server

      - name: Check formatting with Prettier
        run: npx prettier --check "**/*.{js,jsx,json,md}"

  test-client:
    name: Test Client
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run client tests
        run: npm run test:client -- --coverage --watchAll=false
        env:
          CI: true

      - name: Upload client coverage
        uses: actions/upload-artifact@v4
        if: matrix.node-version == 18
        with:
          name: client-coverage
          path: client/coverage

  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run server tests with coverage
        run: npm run test:server -- --coverage
        env:
          CI: true
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/portfolio_test
          JWT_SECRET: test-jwt-secret-minimum-32-characters-long-for-testing

      - name: Check coverage threshold
        run: |
          cd server
          npm test -- --coverage --coverageThreshold='{"global":{"branches":70,"functions":70,"lines":70,"statements":70}}'
        env:
          CI: true
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/portfolio_test
          JWT_SECRET: test-jwt-secret-minimum-32-characters-long-for-testing

      - name: Upload server coverage
        uses: actions/upload-artifact@v4
        if: matrix.node-version == 18
        with:
          name: server-coverage
          path: server/coverage

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit on client
        run: |
          cd client
          npm audit --audit-level=high
        continue-on-error: true

      - name: Run npm audit on server
        run: |
          cd server
          npm audit --audit-level=high
        continue-on-error: true

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint, test-client, test-server]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build:client

      - name: Build verification
        run: |
          if [ ! -d "client/build" ]; then
            echo "Client build failed - build directory not found"
            exit 1
          fi
          echo "Build completed successfully"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: client/build
          retention-days: 7
